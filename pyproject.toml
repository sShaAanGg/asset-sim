[project]
name = "assetsim"
version = "0.1.0"
description = "Personal asset growth simulator + ML learning project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TomTseng", email = "76196301+sShaAanGg@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
ml = [
    "torch>=2.11.0",
]

[tool.uv]
default-groups = ["dev", "ml"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
